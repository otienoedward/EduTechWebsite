```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - EDU TECH Hotel Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">

            <div class="login-logo">
                <h1>EDU TECH</h1>
                <p>Hotel Management System</p>
            </div>

            <h2 style="text-align: center; margin-bottom: 20px;">
                Set New Password
            </h2>

            <form id="resetPasswordForm">

                <div class="form-group">
                    <label for="password">New Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your new password"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        required
                        minlength="6"
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Password
                </button>

                <div
                    id="resetMessage"
                    class="alert"
                    style="display: none; margin-top: 15px;"
                ></div>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const resetPasswordForm =
            document.getElementById("resetPasswordForm");

        const resetMessage =
            document.getElementById("resetMessage");

        resetPasswordForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            resetMessage.style.display = "none";
            resetMessage.textContent = "";

            if (password !== confirmPassword) {

                resetMessage.className = "alert alert-danger";
                resetMessage.textContent =
                    "The passwords do not match.";
                resetMessage.style.display = "block";

                return;
            }

            const {
                data: sessionData,
                error: sessionError
            } = await supabaseClient.auth.getSession();

            if (sessionError || !sessionData.session) {

                resetMessage.className = "alert alert-danger";
                resetMessage.textContent =
                    "This password reset link is invalid or has expired. Please request a new password reset email.";
                resetMessage.style.display = "block";

                return;
            }

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });

            if (error) {

                resetMessage.className = "alert alert-danger";
                resetMessage.textContent = error.message;
                resetMessage.style.display = "block";

                return;
            }

            resetMessage.className = "alert alert-success";
            resetMessage.textContent =
                "Password updated successfully. Redirecting to login...";
            resetMessage.style.display = "block";

            await supabaseClient.auth.signOut();

            setTimeout(function () {
                window.location.href = "login.html";
            }, 2000);
        });
    </script>

</body>
</html>
```
