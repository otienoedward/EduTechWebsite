    <script>

        "use strict";


        /* =====================================================
           SUPABASE
           ===================================================== */

        const db = window.supabaseClient;


        /* =====================================================
           VARIABLES
           ===================================================== */

        let currentUser = null;

        let currentProfile = null;

        let currentRole = null;

        let currentHotelId = null;

        let currentHotelName = "";

        let editingGuestId = null;

        let originalHotelId = null;


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const guestModal =
            document.getElementById("guestModal");

        const guestForm =
            document.getElementById("guestForm");

        const modalTitle =
            document.getElementById("modalTitle");

        const fullNameInput =
            document.getElementById("fullName");

        const phoneInput =
            document.getElementById("phone");

        const idPassportInput =
            document.getElementById("idPassportNumber");

        const emailInput =
            document.getElementById("email");

        const statusInput =
            document.getElementById("status");

        const guestsTableBody =
            document.getElementById("guestsTableBody");

        const totalGuests =
            document.getElementById("totalGuests");

        const activeGuests =
            document.getElementById("activeGuests");

        const inactiveGuests =
            document.getElementById("inactiveGuests");

        const currentHotelNameElement =
            document.getElementById("currentHotelName");

        const messageBox =
            document.getElementById("messageBox");


        /* =====================================================
           MESSAGE
           ===================================================== */

        function showMessage(
            message,
            type = "success"
        ) {

            messageBox.textContent =
                message;

            messageBox.className =
                "message show " + type;

            setTimeout(() => {

                messageBox.className =
                    "message";

            }, 5000);

        }


        /* =====================================================
           GET USER PROFILE
           ===================================================== */

        async function loadUserContext() {

            const {
                data: sessionData,
                error: sessionError
            } = await db.auth.getSession();


            if (sessionError) {
                throw sessionError;
            }


            currentUser =
                sessionData.session?.user || null;


            if (!currentUser) {

                window.location.href =
                    "./login.html";

                return false;

            }


            const {
                data: profile,
                error: profileError
            } = await db
                .from("profiles")
                .select(
                    "id, full_name, role, hotel_id, is_active"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


            if (profileError) {
                throw profileError;
            }


            if (!profile) {

                throw new Error(
                    "User profile was not found."
                );

            }


            currentProfile =
                profile;

            currentRole =
                profile.role;


            /* =================================================
               SYSTEM OWNER
               ================================================= */

            if (
                currentRole ===
                "system_owner"
            ) {

                const storedHotelId =
                    sessionStorage.getItem(
                        "activeHotelId"
                    ) ||
                    sessionStorage.getItem(
                        "hotelId"
                    );


                if (!storedHotelId) {

                    throw new Error(
                        "Please select a hotel first."
                    );

                }


                currentHotelId =
                    Number(storedHotelId);

            }


            /* =================================================
               OTHER USERS
               ================================================= */

            else {

                if (!profile.hotel_id) {

                    throw new Error(
                        "This user has no hotel assigned."
                    );

                }


                currentHotelId =
                    Number(profile.hotel_id);

            }


            if (
                !Number.isFinite(
                    currentHotelId
                ) ||
                currentHotelId <= 0
            ) {

                throw new Error(
                    "Invalid hotel selection."
                );

            }


            sessionStorage.setItem(
                "userRole",
                currentRole
            );

            sessionStorage.setItem(
                "userName",
                profile.full_name ||
                currentUser.email
            );

            sessionStorage.setItem(
                "userId",
                currentUser.id
            );

            sessionStorage.setItem(
                "hotelId",
                String(currentHotelId)
            );


            await loadHotel();


            return true;

        }


        /* =====================================================
           LOAD HOTEL
           hotels table uses hotel_name
           ===================================================== */

        async function loadHotel() {

            const {
                data,
                error
            } = await db
                .from("hotels")
                .select(
                    "id, hotel_name"
                )
                .eq(
                    "id",
                    currentHotelId
                )
                .maybeSingle();


            if (error) {
                throw error;
            }


            if (data) {

                currentHotelName =
                    data.hotel_name ||
                    "Assigned Hotel";


                sessionStorage.setItem(
                    "hotelName",
                    currentHotelName
                );


                currentHotelNameElement.textContent =
                    currentHotelName;

            }

            else {

                currentHotelName =
                    "Assigned Hotel";

                currentHotelNameElement.textContent =
                    currentHotelName;

            }

        }


        /* =====================================================
           PERMISSIONS
           ===================================================== */

        function canAddGuest() {

            return [

                "system_owner",

                "hotel_owner",

                "manager",

                "receptionist"

            ].includes(
                currentRole
            );

        }


        function canEditGuest() {

            return [

                "system_owner",

                "hotel_owner",

                "manager",

                "receptionist"

            ].includes(
                currentRole
            );

        }


        /* =====================================================
           LOAD GUESTS FROM SUPABASE
           ===================================================== */

        async function loadGuests() {

            guestsTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty-row"
                    >
                        Loading guests...
                    </td>

                </tr>

            `;


            const {
                data,
                error
            } = await db
                .from("guests")
                .select("*")
                .eq(
                    "hotel_id",
                    Number(currentHotelId)
                )
                .order(
                    "id",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Guest loading error:",
                    error
                );


                guestsTableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="empty-row"
                        >
                            Could not load guests.
                        </td>

                    </tr>

                `;


                throw error;

            }


            const guests =
                data || [];


            /* =================================================
               SUMMARY
               ================================================= */

            const active =
                guests.filter(
                    guest =>
                        String(
                            guest.status
                        ).toLowerCase() ===
                        "active"
                ).length;


            const inactive =
                guests.length -
                active;


            totalGuests.textContent =
                guests.length;

            activeGuests.textContent =
                active;

            inactiveGuests.textContent =
                inactive;


            /* =================================================
               EMPTY
               ================================================= */

            if (
                guests.length === 0
            ) {

                guestsTableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="empty-row"
                        >
                            No guests found for this hotel.
                        </td>

                    </tr>

                `;

                return;

            }


            /* =================================================
               TABLE
               ================================================= */

            guestsTableBody.innerHTML =

                guests.map(
                    guest => {

                        const guestName =
                            guest["full name"] ||
                            "";

                        const phone =
                            guest.phone ||
                            "";

                        const idPassport =
                            guest.id_passport_number ||
                            "";

                        const email =
                            guest.email ||
                            "";

                        const status =
                            guest.status ||
                            "active";


                        const statusClass =

                            String(status)
                                .toLowerCase() ===
                            "active"

                                ? "status-active"

                                : "status-inactive";


                        return `

                            <tr>

                                <td>
                                    ${escapeHtml(
                                        guest.id
                                    )}
                                </td>


                                <td>
                                    ${escapeHtml(
                                        guestName
                                    )}
                                </td>


                                <td>
                                    ${escapeHtml(
                                        phone
                                    )}
                                </td>


                                <td>
                                    ${escapeHtml(
                                        idPassport
                                    )}
                                </td>


                                <td>
                                    ${escapeHtml(
                                        email
                                    )}
                                </td>


                                <td>

                                    <span
                                        class="status-badge ${statusClass}"
                                    >
                                        ${escapeHtml(
                                            status
                                        )}
                                    </span>

                                </td>


                                <td>

                                    ${
                                        canEditGuest()

                                        ? `

                                            <button
                                                type="button"
                                                class="btn-edit edit-guest-btn"
                                                data-id="${guest.id}"
                                            >
                                                Edit
                                            </button>

                                          `

                                        : ""
                                    }

                                </td>

                            </tr>

                        `;

                    }

                ).join("");


            /* =================================================
               EDIT BUTTONS
               ================================================= */

            document
                .querySelectorAll(
                    ".edit-guest-btn"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const id =
                                    Number(
                                        button.dataset.id
                                    );

                                editGuest(id);

                            }
                        );

                    }
                );

        }


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =====================================================
           OPEN ADD GUEST MODAL
           ===================================================== */

        function openAddGuestModal() {

            if (!canAddGuest()) {

                showMessage(
                    "You do not have permission to add guests.",
                    "error"
                );

                return;

            }


            editingGuestId =
                null;

            originalHotelId =
                null;


            modalTitle.textContent =
                "Add Guest";


            guestForm.reset();


            statusInput.value =
                "active";


            guestModal.classList.add(
                "show"
            );


            setTimeout(
                () => {

                    fullNameInput.focus();

                },
                100
            );

        }


        /* =====================================================
           EDIT GUEST
           ===================================================== */

        async function editGuest(
            id
        ) {

            if (!canEditGuest()) {

                showMessage(
                    "You do not have permission to edit guests.",
                    "error"
                );

                return;

            }


            const {
                data: guest,
                error
            } = await db
                .from("guests")
                .select("*")
                .eq(
                    "id",
                    id
                )
                .eq(
                    "hotel_id",
                    Number(currentHotelId)
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "Edit guest loading error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Could not load guest.",
                    "error"
                );

                return;

            }


            if (!guest) {

                showMessage(
                    "Guest record was not found.",
                    "error"
                );

                return;

            }


            editingGuestId =
                guest.id;

            originalHotelId =
                guest.hotel_id;


            modalTitle.textContent =
                "Edit Guest";


            fullNameInput.value =
                guest["full name"] ||
                "";

            phoneInput.value =
                guest.phone ||
                "";

            idPassportInput.value =
                guest.id_passport_number ||
                "";

            emailInput.value =
                guest.email ||
                "";

            statusInput.value =
                guest.status ||
                "active";


            guestModal.classList.add(
                "show"
            );


            setTimeout(
                () => {

                    fullNameInput.focus();

                },
                100
            );

        }


        /* =====================================================
           CLOSE MODAL
           ===================================================== */

        function closeGuestModal() {

            guestModal.classList.remove(
                "show"
            );


            editingGuestId =
                null;

            originalHotelId =
                null;


            guestForm.reset();

        }


        /* =====================================================
           SAVE GUEST
           ===================================================== */

        async function saveGuest(
            event
        ) {

            event.preventDefault();


            if (
                editingGuestId ===
                null
            ) {

                if (!canAddGuest()) {

                    showMessage(
                        "You do not have permission to add guests.",
                        "error"
                    );

                    return;

                }

            }

            else {

                if (!canEditGuest()) {

                    showMessage(
                        "You do not have permission to edit guests.",
                        "error"
                    );

                    return;

                }

            }


            const fullName =
                fullNameInput.value.trim();

            const phone =
                phoneInput.value.trim();

            const idPassport =
                idPassportInput.value.trim();

            const email =
                emailInput.value.trim();

            const status =
                statusInput.value;


            if (!fullName) {

                showMessage(
                    "Please enter the guest full name.",
                    "error"
                );

                fullNameInput.focus();

                return;

            }


            const saveButton =
                document.getElementById(
                    "saveGuestBtn"
                );


            saveButton.disabled =
                true;

            saveButton.textContent =
                "Saving...";


            try {

                /* =================================================
                   ADD NEW GUEST
                   ================================================= */

                if (
                    editingGuestId ===
                    null
                ) {

                    const guestRecord = {

                        "full name":
                            fullName,

                        phone:
                            phone || null,

                        id_passport_number:
                            idPassport || null,

                        email:
                            email || null,

                        status:
                            status,

                        hotel_id:
                            Number(
                                currentHotelId
                            )

                    };


                    const {
                        data,
                        error
                    } = await db
                        .from("guests")
                        .insert(
                            guestRecord
                        )
                        .select()
                        .single();


                    if (error) {
                        throw error;
                    }


                    console.log(
                        "Guest created:",
                        data
                    );


                    showMessage(
                        "Guest added successfully to Supabase.",
                        "success"
                    );

                }


                /* =================================================
                   UPDATE EXISTING GUEST
                   ================================================= */

                else {

                    const guestRecord = {

                        "full name":
                            fullName,

                        phone:
                            phone || null,

                        id_passport_number:
                            idPassport || null,

                        email:
                            email || null,

                        status:
                            status

                    };


                    const {
                        data,
                        error
                    } = await db
                        .from("guests")
                        .update(
                            guestRecord
                        )
                        .eq(
                            "id",
                            editingGuestId
                        )
                        .eq(
                            "hotel_id",
                            Number(
                                originalHotelId
                            )
                        )
                        .select()
                        .single();


                    if (error) {
                        throw error;
                    }


                    console.log(
                        "Guest updated:",
                        data
                    );


                    showMessage(
                        "Guest updated successfully in Supabase.",
                        "success"
                    );

                }


                closeGuestModal();


                await loadGuests();


            }

            catch (error) {

                console.error(
                    "Save guest error:",
                    error
                );


                let message =
                    error.message ||
                    "Could not save guest.";


                if (
                    error.code ===
                    "23505"
                ) {

                    message =
                        "A guest with this information already exists.";

                }


                showMessage(
                    message,
                    "error"
                );

            }

            finally {

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Save Guest";

            }

        }


        /* =====================================================
           EVENTS
           ===================================================== */

        document
            .getElementById(
                "addGuestBtn"
            )
            .addEventListener(
                "click",
                openAddGuestModal
            );


        document
            .getElementById(
                "refreshBtn"
            )
            .addEventListener(
                "click",
                async () => {

                    try {

                        await loadGuests();

                        showMessage(
                            "Guest list refreshed.",
                            "success"
                        );

                    }

                    catch (error) {

                        console.error(
                            error
                        );

                        showMessage(
                            error.message ||
                            "Could not refresh guests.",
                            "error"
                        );

                    }

                }
            );


        document
            .getElementById(
                "closeModalBtn"
            )
            .addEventListener(
                "click",
                closeGuestModal
            );


        document
            .getElementById(
                "cancelBtn"
            )
            .addEventListener(
                "click",
                closeGuestModal
            );


        guestForm.addEventListener(
            "submit",
            saveGuest
        );


        guestModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    guestModal
                ) {

                    closeGuestModal();

                }

            }
        );


        /* =====================================================
           INITIALIZE
           ===================================================== */

        async function initializeGuestsPage() {

            try {

                if (!db) {

                    throw new Error(
                        "Supabase client was not loaded."
                    );

                }


                const ready =
                    await loadUserContext();


                if (!ready) {
                    return;
                }


                await loadGuests();

            }

            catch (error) {

                console.error(
                    "Guests page initialization error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Could not initialize Guests page.",
                    "error"
                );

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            initializeGuestsPage
        );

    </script>
